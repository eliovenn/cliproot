name: Flutter native validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cliproot-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: '1.99.1'
  CARGO_BUILD_JOBS: '2'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/native

jobs:
  quality:
    name: Static checks and host native test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config
      - uses: ./.github/actions/setup-validation
      - name: Check resource hashes
        run: python tools/ci/check_bootstrap.py
      - name: Check Rust formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --locked -- -D warnings
      - name: Analyze Flutter SDK
        working-directory: packages/flutter
        run: |
          flutter pub get
          flutter analyze
      - name: Analyze validation application
        run: python tools/ci/run_flutter.py --name analyze -- analyze
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed packages/flutter/lib packages/flutter/hook packages/flutter/tool examples/flutter/lib examples/flutter/test examples/flutter/integration_test examples/flutter/test_driver
      - name: Run native loading and lifecycle checks
        run: python tools/ci/run_flutter.py --name host-native-test -- test test/native_loading_test.dart --reporter expanded --no-pub
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-logs
          path: examples/flutter/validation-results/
          retention-days: 7

  desktop:
    name: ${{ matrix.label }} build and run
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x64
            platform: linux
            source: examples/flutter/build/linux/x64/debug/bundle
          - runner: windows-2025
            label: windows-x64
            platform: windows
            source: examples/flutter/build/windows/x64/runner/Debug
          - runner: macos-15-intel
            label: macos-x64
            platform: macos
            source: examples/flutter/build/macos/Build/Products/Debug/cliproot_validation.app
          - runner: macos-15
            label: macos-arm64
            platform: macos
            source: examples/flutter/build/macos/Build/Products/Debug/cliproot_validation.app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux desktop tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb xauth libgl1-mesa-dri
      - uses: ./.github/actions/setup-validation
      - name: Build normal validation application
        id: build
        run: python tools/ci/run_flutter.py --name build -- build ${{ matrix.platform }} --debug --no-pub
      - name: Archive normal build before integration test
        run: python tools/ci/archive_build.py --name ${{ matrix.label }} --source ${{ matrix.source }}
      - name: Run packaged validation on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/ci/run_flutter.py --name integration -- drive --driver test_driver/integration_test.dart --target integration_test/native_loading_test.dart -d linux --no-pub
      - name: Run packaged validation on Windows or macOS
        if: runner.os != 'Linux'
        run: python tools/ci/run_flutter.py --name integration -- drive --driver test_driver/integration_test.dart --target integration_test/native_loading_test.dart -d ${{ matrix.platform }} --no-pub
      - name: Upload build and validation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.label }}-validation
          path: examples/flutter/validation-results/
          retention-days: 7

  android:
    name: Android API ${{ matrix.api }} emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native generation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
      - uses: ./.github/actions/setup-validation
        with:
          rust-targets: armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
      - name: Install build SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build all declared Android ABI APKs
        if: matrix.api == 28
        run: python tools/ci/run_flutter.py --name android-abis -- build apk --debug --split-per-abi --no-pub
      - name: Archive Android APKs
        if: matrix.api == 28
        run: python tools/ci/archive_build.py --name android-abis --source examples/flutter/build/app/outputs/flutter-apk
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native checks in emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python tools/ci/run_flutter.py --name android-integration -- drive --driver test_driver/integration_test.dart --target integration_test/native_loading_test.dart -d emulator-5554 --no-pub
      - name: Upload APKs and emulator report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-api-${{ matrix.api }}-validation
          path: examples/flutter/validation-results/
          retention-days: 7

  ios:
    name: iOS arm64 simulator build and run
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-validation
        with:
          rust-targets: aarch64-apple-ios-sim
      - name: Provide host libclang for iOS binding generation
        run: |
          if ! brew list llvm >/dev/null 2>&1; then brew install llvm; fi
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Build simulator application without signing secrets
        run: python tools/ci/run_flutter.py --name ios-build -- build ios --simulator --debug --no-codesign --no-pub
      - name: Archive simulator application
        run: python tools/ci/archive_build.py --name ios-arm64-simulator --source examples/flutter/build/ios/iphonesimulator/Runner.app
      - name: Select and boot available iPhone simulator
        run: python tools/ci/select_ios_simulator.py
      - name: Run native checks in simulator
        run: python tools/ci/run_flutter.py --name ios-integration -- drive --driver test_driver/integration_test.dart --target integration_test/native_loading_test.dart -d "$CLIPROOT_IOS_DEVICE" --no-pub
      - name: Upload simulator build and report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-arm64-simulator-validation
          path: examples/flutter/validation-results/
          retention-days: 7
