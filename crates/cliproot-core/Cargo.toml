[package]
name = "cliproot-core"
description = "Shared content extraction host for Cliproot JavaScript rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
atomic-write-file.workspace = true
base64.workspace = true
chrono.workspace = true
flate2.workspace = true
futures-util.workspace = true
include_dir.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
llrt_buffer.workspace = true
llrt_crypto.workspace = true
llrt_exceptions.workspace = true
llrt_url.workspace = true
llrt_util.workspace = true

# rquickjs does not ship Android or iOS C bindings. Reuse bindgen with the
# target SDK sysroot supplied by the Flutter build hook.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }
